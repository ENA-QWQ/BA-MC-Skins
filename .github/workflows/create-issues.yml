name: Create Issues for Skins

on:
  push:
    branches:
      - main

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create issues for missing skins
        run: npm run create-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}